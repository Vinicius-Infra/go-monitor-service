services:
  go-monitor:
    build: .
    container_name: go_monitor_container
    restart: always
    network_mode: "host" # Isso permite que o Go veja o 'localhost' do Windows

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"